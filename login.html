<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión o crea tu cuenta en Arima.">
    <title>Arima - Sign in</title>
    
    <!-- Open Graph -->
    <meta property="og:title" content="Arima - Sign in">
    <meta property="og:description" content="Inicia sesión o crea tu cuenta en Arima.">
    <meta property="og:type" content="website">
    
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Kapakana:wght@300..400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
    <script defer src="js/funciones.js"></script>
</head>
<body class="login-body">

    <header class="login-header">
        <a href="index.html" class="logo-arima">Arima</a>
    </header>

    <main class="login-container">
        <div class="login-box">
            <h1>Sign in</h1>
            <p class="login-subtitle">Sign in or create an account</p>

            <!--JS: Autenticación externa con Shop Pay-->
            <button type="button" class="btn-shop-pay" id="btnShopPay">
                Continue with <span>shɔp</span>
            </button>

            <div class="login-divider">
                <span>or</span>
            </div>

            <!--JS: Validación de formato de email-->
            <form class="login-form" id="loginForm">
                <div class="input-wrapper">
                    <input type="email" id="emailInput" placeholder="Email" required>
                    <button type="submit" class="btn-submit" aria-label="Continuar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>

                <label class="checkbox-container">
                    <!--JS: Guardar estado de suscripción del usuario-->
                    <input type="checkbox" id="newsletterCheckbox" checked>
                    <span class="checkmark"></span>
                    <span class="label-text">Email me with news and offers</span>
                </label>
            </form>

            <p class="terms-text">
                By continuing, you agree to our <a href="#">Terms of service</a>
            </p>
        </div>
    </main>

    <footer class="login-footer">
        <a href="#">Privacy policy</a>
    </footer>

</body>
</html>
